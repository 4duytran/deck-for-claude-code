name: macOS

# MEASUREMENT mode: the smoke and the sweep never fail the job, the report step
# prints every probe verdict (step summary, notice, one error per BAD probe) and
# the artifact keeps test/*.out. The timeout is the envelope of 86 probes x 180 s.
on:
  push:
    branches: [main, feat/macos-support]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 270
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The node-pty 1.1.0 darwin prebuild ships spawn-helper as 0644 (node-pty#850):
      # the postinstall source build must replace it with an executable one.
      - name: Check spawn-helper is executable
        run: |
          test -x node_modules/node-pty/build/Release/spawn-helper && ls -l node_modules/node-pty/build/Release/spawn-helper

      - name: Install Electron binary
        run: npx install-electron --no

      - name: Syntax gate
        run: |
          for f in main.js preload.js $(find src/main -name '*.js') bin/*.js; do node --check "$f" || exit 1; done

      - name: Smoke probe
        continue-on-error: true
        run: bash test/run.sh boot-clean-probe

      - name: Probe sweep
        id: sweep
        continue-on-error: true
        shell: bash
        run: |
          npm test 2>&1 | tee sweep.log; exit ${PIPESTATUS[0]}

      - name: Report
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          # Workflow-command data: % -> %25, CR -> %0D, LF -> %0A.
          enc() { LC_ALL=C awk '{ gsub(/%/, "%25"); gsub(/\r/, "%0D"); if (NR > 1) printf "%%0A"; printf "%s", $0 }'; }
          [ -f sweep.log ] || : > sweep.log

          {
            echo "### Probe sweep on $MATRIX_OS (sweep step: ${{ steps.sweep.outcome }})"
            echo
            echo "| probe | verdict | detail |"
            echo "|---|---|---|"
            LC_ALL=C awk '/^(OK|BAD) / {
              d = ""; i = index($0, " | ")
              if (i > 0) {
                n = split(substr($0, i + 3), a, " [|] "); d = a[1]
                for (k = 2; k <= n; k++) d = d " \\| " a[k]
              }
              printf "| %s | %s | %s |\n", $2, $1, d
            }' sweep.log
            echo
            echo '```'
            grep -E '^(SKIPPED|=====)' sweep.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          msg=$(grep -E '^(OK|BAD|SKIPPED|FAILED|=====)' sweep.log || true)
          if [ "${#msg}" -gt 60000 ]; then msg="${msg:0:60000}…truncated, see artifact"; fi
          echo "::notice title=sweep-$MATRIX_OS::$(printf '%s' "$msg" | enc)"

          total=$(awk '/^BAD  /{n++} END{print n+0}' sweep.log)
          shown=0
          for p in $(awk '/^BAD  /{print $2}' sweep.log); do
            [ "$shown" -lt 9 ] || break
            shown=$((shown + 1))
            # BAD line (rc, verdict), at most 30 FAIL lines, last 20 lines, each cut at 400 bytes.
            body=$({
              grep -F "BAD  $p " sweep.log || true
              LC_ALL=C awk '/^FAIL /{ if (++n <= 30) print substr($0, 1, 400) }' "test/$p.out" || true
              tail -n 20 "test/$p.out" | LC_ALL=C cut -c1-400 || true
            } 2>/dev/null)
            echo "::error title=$p::$(printf '%s' "$body" | enc)"
          done
          if [ "$total" -gt 9 ]; then
            echo "::error title=sweep-$MATRIX_OS::$((total - 9)) more BAD probes, see artifact"
          fi

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-out-${{ matrix.os }}
          path: |
            test/*.out
            sweep.log
